name: Publish Package

on:
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Print versions
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: yarn --immutable

      - name: Build
        run: yarn build

      - name: Clean package.json
        run: npm pkg delete scripts devDependencies packageManager

      - name: Publish
        run: npm publish
